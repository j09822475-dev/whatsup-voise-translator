name: Build APK

on:
  push:
    branches:
      - claude/android-translate-whatsapp-app-98lmh5
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: voise-translator-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A release gives a stable, tappable download link for installing on the phone.
      - name: Publish to the rolling "latest-debug" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk voise-translator.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug voise-translator.apk \
            --title "Voise Translator (debug, ${GITHUB_SHA::7})" \
            --notes "Отладочная сборка из ветки \`${GITHUB_REF_NAME}\`, коммит \`${GITHUB_SHA::7}\`.

          Скачайте \`voise-translator.apk\` и установите на телефон (потребуется разрешить установку из неизвестных источников).

          Подписано отладочным ключом — для личной установки, не для Google Play." \
            --prerelease
